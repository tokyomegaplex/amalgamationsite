<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amalgamation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@700&family=Bebas+Neue&family=Caveat:wght@700&family=Press+Start+2P&family=Righteous&family=Permanent+Marker&family=Abril+Fatface&family=Lobster&family=Orbitron:wght@700&family=Pacifico&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace;
    cursor: none !important;
  }

  .text-container {
    display: flex;
    position: relative;
    user-select: none;
  }

  .letter-pair {
    font-size: 5rem;
    font-weight: 700;
    color: #e0e0e0;
    position: relative;
    display: inline-block;
    will-change: transform;
    letter-spacing: 0.02em;
    transform-origin: center center;
  }

  .letter-pair.grabbed { color: #ffffff; }

  /* --- Fake cursor --- */
  #cursor {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    will-change: transform;
  }
  #cursor svg { display: none; }
  #cursor .arrow   { display: block; }
  #cursor.grab     .arrow { display: none; }
  #cursor.grab     .grab  { display: block; }
  #cursor.grabbing .arrow    { display: none; }
  #cursor.grabbing .grabbing { display: block; }
  #cursor.nwse .arrow { display: none; }
  #cursor.nwse .resize-nwse { display: block; }
  #cursor.nesw .arrow { display: none; }
  #cursor.nesw .resize-nesw { display: block; }

  /* --- Transform box --- */
  #transform-box {
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    display: none;
  }
  #transform-box.visible { display: block; }

  #transform-box .border {
    position: absolute;
    inset: 0;
    border: 1.5px dashed rgba(120, 170, 255, 0.7);
  }

  #transform-box .handle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #fff;
    border: 1.5px solid rgba(120, 170, 255, 0.9);
  }
  /* corners */
  #transform-box .handle.tl { top: -4px; left: -4px; }
  #transform-box .handle.tc { top: -4px; left: calc(50% - 4px); }
  #transform-box .handle.tr { top: -4px; right: -4px; }
  #transform-box .handle.ml { top: calc(50% - 4px); left: -4px; }
  #transform-box .handle.mr { top: calc(50% - 4px); right: -4px; }
  #transform-box .handle.bl { bottom: -4px; left: -4px; }
  #transform-box .handle.bc { bottom: -4px; left: calc(50% - 4px); }
  #transform-box .handle.br { bottom: -4px; right: -4px; }

  /* --- Font dropdown --- */
  #font-dropdown {
    position: fixed;
    pointer-events: none;
    z-index: 9998;
    display: none;
    background: #2a2a2a;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 2px 0;
    min-width: 180px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  #font-dropdown.visible { display: block; }

  #font-dropdown .font-option {
    padding: 5px 12px;
    color: #ccc;
    font-size: 14px;
    white-space: nowrap;
    transition: background 0.05s;
  }
  #font-dropdown .font-option.hovered {
    background: #3a6abf;
    color: #fff;
  }

  /* I-beam cursor for text cursor */
  #cursor.text-cursor .arrow { display: none; }
  #cursor.text-cursor .ibeam { display: block; }
</style>
</head>
<body>

<div class="text-container" id="container"></div>

<!-- Font picker dropdown -->
<div id="font-dropdown"></div>

<!-- Transform bounding box overlay -->
<div id="transform-box">
  <div class="border"></div>
  <div class="handle tl"></div>
  <div class="handle tc"></div>
  <div class="handle tr"></div>
  <div class="handle ml"></div>
  <div class="handle mr"></div>
  <div class="handle bl"></div>
  <div class="handle bc"></div>
  <div class="handle br"></div>
</div>

<!-- Fake cursor element -->
<div id="cursor">
  <!-- Arrow -->
  <svg class="arrow" width="24" height="24" viewBox="0 0 24 24" fill="none">
    <path d="M5 3l14 9-7 1.5L8 21z" fill="#fff" stroke="#000" stroke-width="1"/>
  </svg>
  <!-- Open hand -->
  <svg class="grab" width="28" height="28" viewBox="0 0 28 28" fill="none">
    <g fill="#fff" stroke="#000" stroke-width="0.8">
      <rect x="7" y="14" width="14" height="10" rx="4"/>
      <rect x="8"  y="6"  width="3" height="10" rx="1.5"/>
      <rect x="12" y="4"  width="3" height="12" rx="1.5"/>
      <rect x="16" y="6"  width="3" height="10" rx="1.5"/>
      <rect x="20" y="9"  width="3" height="8"  rx="1.5"/>
    </g>
  </svg>
  <!-- Closed hand -->
  <svg class="grabbing" width="28" height="28" viewBox="0 0 28 28" fill="none">
    <g fill="#fff" stroke="#000" stroke-width="0.8">
      <rect x="7" y="12" width="14" height="12" rx="4"/>
      <rect x="8"  y="9"  width="3" height="6" rx="1.5"/>
      <rect x="12" y="8"  width="3" height="7" rx="1.5"/>
      <rect x="16" y="9"  width="3" height="6" rx="1.5"/>
      <rect x="20" y="10" width="3" height="5" rx="1.5"/>
    </g>
  </svg>
  <!-- I-beam (text select) -->
  <svg class="ibeam" width="24" height="24" viewBox="0 0 24 24" fill="none">
    <g stroke="#fff" stroke-width="2" stroke-linecap="round">
      <line x1="12" y1="4" x2="12" y2="20"/>
      <line x1="9" y1="4" x2="15" y2="4"/>
      <line x1="9" y1="20" x2="15" y2="20"/>
    </g>
    <g stroke="#000" stroke-width="3.5" stroke-linecap="round" opacity="0.3">
      <line x1="12" y1="4" x2="12" y2="20"/>
    </g>
    <g stroke="#fff" stroke-width="2" stroke-linecap="round">
      <line x1="12" y1="4" x2="12" y2="20"/>
      <line x1="9" y1="4" x2="15" y2="4"/>
      <line x1="9" y1="20" x2="15" y2="20"/>
    </g>
  </svg>
  <!-- Resize NWSE (top-left / bottom-right diagonal) -->
  <svg class="resize-nwse" width="24" height="24" viewBox="0 0 24 24" fill="none">
    <g stroke="#fff" stroke-width="2" stroke-linecap="round">
      <line x1="5" y1="5" x2="19" y2="19"/>
      <polyline points="5,11 5,5 11,5"/>
      <polyline points="19,13 19,19 13,19"/>
    </g>
    <g stroke="#000" stroke-width="3.5" stroke-linecap="round" opacity="0.3">
      <line x1="5" y1="5" x2="19" y2="19"/>
    </g>
    <g stroke="#fff" stroke-width="2" stroke-linecap="round">
      <line x1="5" y1="5" x2="19" y2="19"/>
      <polyline points="5,11 5,5 11,5"/>
      <polyline points="19,13 19,19 13,19"/>
    </g>
  </svg>
  <!-- Resize NESW (top-right / bottom-left diagonal) -->
  <svg class="resize-nesw" width="24" height="24" viewBox="0 0 24 24" fill="none">
    <g stroke="#000" stroke-width="3.5" stroke-linecap="round" opacity="0.3">
      <line x1="19" y1="5" x2="5" y2="19"/>
    </g>
    <g stroke="#fff" stroke-width="2" stroke-linecap="round">
      <line x1="19" y1="5" x2="5" y2="19"/>
      <polyline points="13,5 19,5 19,11"/>
      <polyline points="11,19 5,19 5,13"/>
    </g>
  </svg>
</div>

<script>
// ==================== SETUP ====================
const word = "Amalgamation";
const pairStrings = [];
for (let i = 0; i < word.length; i += 2) {
  pairStrings.push(word.slice(i, i + 2));
}

const container = document.getElementById("container");
const cursorEl = document.getElementById("cursor");
const transformBox = document.getElementById("transform-box");
const elements = [];

pairStrings.forEach((pair) => {
  const span = document.createElement("span");
  span.className = "letter-pair";
  span.textContent = pair;
  container.appendChild(span);
  elements.push(span);
});

// Per-pair state: offset + independent x/y scale + natural dims
// baseCenterX/Y = screen center when tx=ty=0, scaleX=scaleY=1
const pairState = elements.map((el) => {
  const r = el.getBoundingClientRect();
  return {
    x: 0, y: 0,
    scaleX: 1, scaleY: 1,
    naturalHW: r.width / 2,
    naturalHH: r.height / 2,
    baseCenterX: r.left + r.width / 2,
    baseCenterY: r.top + r.height / 2,
  };
});

// ==================== UTILS ====================
function randomRange(min, max) {
  return min + Math.random() * (max - min);
}
function lerp(a, b, t) {
  return a + (b - a) * t;
}
function clamp(v, lo, hi) {
  return Math.max(lo, Math.min(hi, v));
}

// Mouse acceleration curve
function mouseEase(t) {
  if (t < 0.15) {
    const s = t / 0.15;
    return 0.15 * s * s;
  } else if (t < 0.7) {
    return 0.15 + (t - 0.15) * (0.75 / 0.55);
  } else {
    const s = (t - 0.7) / 0.3;
    const overshoot = 1.02;
    return Math.min(0.9 + 0.1 * (1 - Math.pow(1 - s, 3)) * overshoot, 1.005);
  }
}

function handTremor(t, seed) {
  return Math.sin(t * 47.3 + seed) * 0.7
       + Math.sin(t * 91.7 + seed * 2.3) * 0.4
       + Math.sin(t * 23.1 + seed * 0.7) * 0.5
       + Math.sin(t * 137.9 + seed * 3.1) * 0.25;
}

function generateMousePath(x0, y0, x1, y1, numPoints) {
  const points = [];
  const dx = x1 - x0, dy = y1 - y0;
  const dist = Math.sqrt(dx * dx + dy * dy) || 1;
  const px = -dy / dist, py = dx / dist;
  const arcAmount = randomRange(-dist * 0.08, dist * 0.08);
  const seed = Math.random() * 1000;

  for (let i = 0; i <= numPoints; i++) {
    const t = i / numPoints;
    const eased = mouseEase(t);
    let x = lerp(x0, x1, eased);
    let y = lerp(y0, y1, eased);
    const arcT = Math.sin(t * Math.PI);
    x += px * arcAmount * arcT;
    y += py * arcAmount * arcT;
    x += handTremor(t * 10, seed) * 1.2;
    y += handTremor(t * 10, seed + 500) * 1.2;
    points.push({ x, y });
  }
  return points;
}

function getMoveDuration(dist) {
  // Fast, snappy movements like a real mouse
  return 80 + Math.sqrt(dist) * 10 + randomRange(0, 60);
}
function getDragDuration(dist) {
  return 100 + Math.sqrt(dist) * 14 + randomRange(0, 80);
}

function followPath(cursor, now) {
  const elapsed = now - cursor.pathStartTime;
  const t = Math.min(elapsed / cursor.pathDuration, 1);
  const idx = Math.min(Math.floor(t * (cursor.path.length - 1)), cursor.path.length - 1);
  cursor.x = cursor.path[idx].x;
  cursor.y = cursor.path[idx].y;
  return t;
}

// ==================== TRANSFORM BOX ====================
// Which handle names correspond to which corner
const HANDLE_NAMES = ['tl','tc','tr','ml','mr','bl','bc','br'];
const CORNER_HANDLES = ['tl','tr','bl','br'];

function getHandlePosition(rect, handle) {
  switch (handle) {
    case 'tl': return { x: rect.left,                    y: rect.top };
    case 'tc': return { x: rect.left + rect.width / 2,   y: rect.top };
    case 'tr': return { x: rect.left + rect.width,        y: rect.top };
    case 'ml': return { x: rect.left,                    y: rect.top + rect.height / 2 };
    case 'mr': return { x: rect.left + rect.width,        y: rect.top + rect.height / 2 };
    case 'bl': return { x: rect.left,                    y: rect.top + rect.height };
    case 'bc': return { x: rect.left + rect.width / 2,   y: rect.top + rect.height };
    case 'br': return { x: rect.left + rect.width,        y: rect.top + rect.height };
  }
}

function getHandleCursorClass(handle) {
  if (handle === 'tl' || handle === 'br') return 'nwse';
  if (handle === 'tr' || handle === 'bl') return 'nesw';
  // For edge handles, just use nwse as a fallback
  return 'nwse';
}

// The "anchor" is the opposite corner/edge from the grabbed handle
function getAnchorHandle(handle) {
  const map = { tl:'br', tr:'bl', bl:'tr', br:'tl', tc:'bc', bc:'tc', ml:'mr', mr:'ml' };
  return map[handle];
}

function getPairScreenBox(pairIndex) {
  const ps = pairState[pairIndex];
  const cx = ps.baseCenterX + ps.x;
  const cy = ps.baseCenterY + ps.y;
  const hw = ps.naturalHW * ps.scaleX;
  const hh = ps.naturalHH * ps.scaleY;
  return { left: cx - hw, top: cy - hh, width: hw * 2, height: hh * 2 };
}

function updateTransformBoxPosition(pairIndex) {
  const b = getPairScreenBox(pairIndex);
  transformBox.style.left   = b.left + 'px';
  transformBox.style.top    = b.top + 'px';
  transformBox.style.width  = b.width + 'px';
  transformBox.style.height = b.height + 'px';
}

function showTransformBox(pairIndex) {
  transformBox.classList.add('visible');
  updateTransformBoxPosition(pairIndex);
}

function hideTransformBox() {
  transformBox.classList.remove('visible');
}

// ==================== FONT DROPDOWN ====================
const FONTS = [
  { name: 'Courier New',       css: "'Courier New', Courier, monospace" },
  { name: 'Playfair Display',  css: "'Playfair Display', serif" },
  { name: 'Space Mono',        css: "'Space Mono', monospace" },
  { name: 'Bebas Neue',        css: "'Bebas Neue', sans-serif" },
  { name: 'Caveat',            css: "'Caveat', cursive" },
  { name: 'Press Start 2P',    css: "'Press Start 2P', monospace" },
  { name: 'Righteous',         css: "'Righteous', sans-serif" },
  { name: 'Permanent Marker',  css: "'Permanent Marker', cursive" },
  { name: 'Abril Fatface',     css: "'Abril Fatface', serif" },
  { name: 'Lobster',           css: "'Lobster', cursive" },
  { name: 'Orbitron',          css: "'Orbitron', sans-serif" },
  { name: 'Pacifico',          css: "'Pacifico', cursive" },
  { name: 'Rubik Mono One',    css: "'Rubik Mono One', monospace" },
];

const fontDropdown = document.getElementById("font-dropdown");
let fontOptionEls = [];

function buildDropdownOptions(excludeFont) {
  // Pick 5-7 random fonts to show (always include a few, exclude current)
  const available = FONTS.filter(f => f.name !== excludeFont);
  const shuffled = available.sort(() => Math.random() - 0.5);
  const count = Math.floor(randomRange(5, 8));
  const chosen = shuffled.slice(0, count);

  fontDropdown.innerHTML = '';
  fontOptionEls = [];
  chosen.forEach(f => {
    const div = document.createElement('div');
    div.className = 'font-option';
    div.textContent = f.name;
    div.style.fontFamily = f.css;
    div.dataset.fontCss = f.css;
    div.dataset.fontName = f.name;
    fontDropdown.appendChild(div);
    fontOptionEls.push(div);
  });
}

function showFontDropdown(x, y) {
  fontDropdown.style.left = x + 'px';
  fontDropdown.style.top = y + 'px';
  fontDropdown.classList.add('visible');
}

function hideFontDropdown() {
  fontDropdown.classList.remove('visible');
  fontOptionEls.forEach(el => el.classList.remove('hovered'));
}

function highlightFontOption(index) {
  fontOptionEls.forEach((el, i) => {
    el.classList.toggle('hovered', i === index);
  });
}

// Track current font per pair
const pairFonts = elements.map(() => "'Courier New', Courier, monospace");

// ==================== STATE MACHINE ====================
const cursor = {
  x: window.innerWidth / 2,
  y: window.innerHeight / 2 - 100,
  targetPair: -1,
  phase: 'idle',
  path: [],
  pathStartTime: 0,
  pathDuration: 0,
  dragStartCursorX: 0,
  dragStartCursorY: 0,
  dragStartPairX: 0,
  dragStartPairY: 0,
  idleTimer: 0,
  hoverTimer: 0,
  // transform-specific
  actionType: 'drag', // 'drag' or 'transform'
  selectedHandle: 'br',
  anchorX: 0,
  anchorY: 0,
  startScaleX: 1,
  startScaleY: 1,
  startHandleX: 0,
  startHandleY: 0,
  // sign of (handle - anchor) per axis at drag start
  signX: 1,
  signY: 1,
  // font-change specific
  selectedFontIndex: 0,
};

function pickNextTarget() {
  let next;
  do {
    next = Math.floor(Math.random() * elements.length);
  } while (next === cursor.targetPair && Math.random() > 0.3);
  return next;
}

function getPairCenter(i) {
  const rect = elements[i].getBoundingClientRect();
  return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
}

// --- Phase transitions ---

function startIdle() {
  cursor.phase = 'idle';
  cursor.idleTimer = randomRange(80, 350);
  cursorEl.className = '';
  hideTransformBox();
  hideFontDropdown();
}

function startMoveToTarget() {
  cursor.targetPair = pickNextTarget();
  // Decide action type: ~35% transform, ~40% drag, ~25% fontChange
  const roll = Math.random();
  cursor.actionType = roll < 0.35 ? 'transform' : roll < 0.75 ? 'drag' : 'fontChange';

  let aimX, aimY;
  const center = getPairCenter(cursor.targetPair);

  if (cursor.actionType === 'drag') {
    aimX = center.x + randomRange(-10, 10);
    aimY = center.y + randomRange(-8, 8);
  } else if (cursor.actionType === 'fontChange') {
    // Move to the text (we'll right-click / click on it)
    aimX = center.x + randomRange(-5, 15);
    aimY = center.y + randomRange(-5, 5);
  } else {
    aimX = center.x + randomRange(-5, 5);
    aimY = center.y + randomRange(-5, 5);
  }

  const dist = Math.sqrt((aimX - cursor.x) ** 2 + (aimY - cursor.y) ** 2);
  cursor.path = generateMousePath(cursor.x, cursor.y, aimX, aimY, 60);
  cursor.pathStartTime = performance.now();
  cursor.pathDuration = getMoveDuration(dist);
  cursor.phase = 'moveToTarget';
  cursorEl.className = '';
}

function startHover() {
  cursor.phase = 'hover';
  cursor.hoverTimer = randomRange(80, 250);

  if (cursor.actionType === 'fontChange') {
    cursorEl.className = 'text-cursor';
  } else {
    cursorEl.className = 'grab';
  }

  if (cursor.actionType === 'transform') {
    showTransformBox(cursor.targetPair);
  }
}

function startMoveToHandle() {
  // Pick a corner handle
  cursor.selectedHandle = CORNER_HANDLES[Math.floor(Math.random() * CORNER_HANDLES.length)];
  const boxRect = getPairScreenBox(cursor.targetPair);
  const handlePos = getHandlePosition(boxRect, cursor.selectedHandle);
  const aimX = handlePos.x + randomRange(-2, 2);
  const aimY = handlePos.y + randomRange(-2, 2);
  const dist = Math.sqrt((aimX - cursor.x) ** 2 + (aimY - cursor.y) ** 2);
  cursor.path = generateMousePath(cursor.x, cursor.y, aimX, aimY, 40);
  cursor.pathStartTime = performance.now();
  cursor.pathDuration = getMoveDuration(dist);
  cursor.phase = 'moveToHandle';
  cursorEl.className = '';
}

function startHandleHover() {
  cursor.phase = 'handleHover';
  cursor.hoverTimer = randomRange(50, 150);
  cursorEl.className = getHandleCursorClass(cursor.selectedHandle);
}

function startGrab() {
  if (cursor.actionType === 'drag') {
    cursor.phase = 'grab';
    cursor.hoverTimer = randomRange(30, 80);
    cursorEl.className = 'grabbing';
    elements[cursor.targetPair].classList.add('grabbed');
    cursor.dragStartPairX = pairState[cursor.targetPair].x;
    cursor.dragStartPairY = pairState[cursor.targetPair].y;
    cursor.dragStartCursorX = cursor.x;
    cursor.dragStartCursorY = cursor.y;
  }
}

function startTransformGrab() {
  cursor.phase = 'transformGrab';
  cursor.hoverTimer = randomRange(30, 70);

  const anchorHandle = getAnchorHandle(cursor.selectedHandle);
  const box = getPairScreenBox(cursor.targetPair);
  const anchorPos = getHandlePosition(box, anchorHandle);
  const handlePos = getHandlePosition(box, cursor.selectedHandle);

  cursor.anchorX = anchorPos.x;
  cursor.anchorY = anchorPos.y;
  cursor.startHandleX = handlePos.x;
  cursor.startHandleY = handlePos.y;
  cursor.startScaleX = pairState[cursor.targetPair].scaleX;
  cursor.startScaleY = pairState[cursor.targetPair].scaleY;
  // record which direction handle is relative to anchor
  cursor.signX = Math.sign(handlePos.x - anchorPos.x) || 1;
  cursor.signY = Math.sign(handlePos.y - anchorPos.y) || 1;
}

function startDrag() {
  const dragDist = randomRange(20, 80);
  const dragAngle = Math.random() * Math.PI * 2;
  const currentX = pairState[cursor.targetPair].x;
  const currentY = pairState[cursor.targetPair].y;
  const distFromOrigin = Math.sqrt(currentX ** 2 + currentY ** 2);
  let biasAngle = dragAngle;
  if (distFromOrigin > 30) {
    const toOrigin = Math.atan2(-currentY, -currentX);
    biasAngle = lerp(dragAngle, toOrigin, 0.4 + Math.random() * 0.3);
  }
  const destX = cursor.x + Math.cos(biasAngle) * dragDist;
  const destY = cursor.y + Math.sin(biasAngle) * dragDist;
  const dist = Math.sqrt((destX - cursor.x) ** 2 + (destY - cursor.y) ** 2);

  if (Math.random() < 0.35) {
    const midX = cursor.x + Math.cos(biasAngle) * dragDist * 0.5 + randomRange(-15, 15);
    const midY = cursor.y + Math.sin(biasAngle) * dragDist * 0.5 + randomRange(-15, 15);
    const path1 = generateMousePath(cursor.x, cursor.y, midX, midY, 30);
    const path2 = generateMousePath(midX, midY, destX, destY, 30);
    cursor.path = path1.concat(path2.slice(1));
  } else {
    cursor.path = generateMousePath(cursor.x, cursor.y, destX, destY, 60);
  }

  cursor.pathStartTime = performance.now();
  cursor.pathDuration = getDragDuration(dist);
  cursor.phase = 'drag';
  cursor.dragStartCursorX = cursor.x;
  cursor.dragStartCursorY = cursor.y;
  cursor.dragStartPairX = pairState[cursor.targetPair].x;
  cursor.dragStartPairY = pairState[cursor.targetPair].y;
}

function biasedTargetScale(current) {
  if (current > 1.4) return randomRange(0.65, 1.1);
  if (current < 0.65) return randomRange(0.9, 1.5);
  return randomRange(0.55, 1.7);
}

function startTransformDrag() {
  const ps = pairState[cursor.targetPair];
  // Pick independent target scales for X and Y
  const targetSX = biasedTargetScale(ps.scaleX);
  const targetSY = biasedTargetScale(ps.scaleY);

  // Where should the handle end up given those target scales?
  // handle_x = anchor_x + signX * 2 * naturalHW * targetSX
  const destX = cursor.anchorX + cursor.signX * 2 * ps.naturalHW * targetSX;
  const destY = cursor.anchorY + cursor.signY * 2 * ps.naturalHH * targetSY;

  const moveDist = Math.sqrt((destX - cursor.x) ** 2 + (destY - cursor.y) ** 2);
  cursor.path = generateMousePath(cursor.x, cursor.y, destX, destY, 60);
  cursor.pathStartTime = performance.now();
  cursor.pathDuration = getDragDuration(moveDist);
  cursor.phase = 'transformDrag';
}

function startRelease() {
  cursor.phase = 'release';
  cursor.hoverTimer = randomRange(50, 180);
  if (cursor.actionType === 'drag') {
    cursorEl.className = 'grab';
    elements[cursor.targetPair].classList.remove('grabbed');
  } else {
    cursorEl.className = getHandleCursorClass(cursor.selectedHandle);
  }
}

function startTransformRelease() {
  cursor.phase = 'transformRelease';
  cursor.hoverTimer = randomRange(80, 250);
  cursorEl.className = '';
}

// --- FONT CHANGE PHASES ---

function startFontClick() {
  // "Click" on the pair — brief pause as if clicking
  cursor.phase = 'fontClick';
  cursor.hoverTimer = randomRange(60, 150);
  cursorEl.className = 'text-cursor';
  // Highlight the pair
  elements[cursor.targetPair].classList.add('grabbed');
}

function startFontDropdownShow() {
  cursor.phase = 'fontDropdownShow';
  cursor.hoverTimer = randomRange(150, 350);
  cursorEl.className = '';
  // Build and show the dropdown near the cursor
  const currentFontName = FONTS.find(f => f.css === pairFonts[cursor.targetPair])?.name || '';
  buildDropdownOptions(currentFontName);
  showFontDropdown(cursor.x + 8, cursor.y + 8);
}

function startMoveToFontOption() {
  // Pick a random option from the dropdown
  cursor.selectedFontIndex = Math.floor(Math.random() * fontOptionEls.length);
  const optionEl = fontOptionEls[cursor.selectedFontIndex];
  const rect = optionEl.getBoundingClientRect();
  const aimX = rect.left + randomRange(20, rect.width - 10);
  const aimY = rect.top + rect.height / 2 + randomRange(-2, 2);
  const dist = Math.sqrt((aimX - cursor.x) ** 2 + (aimY - cursor.y) ** 2);
  cursor.path = generateMousePath(cursor.x, cursor.y, aimX, aimY, 40);
  cursor.pathStartTime = performance.now();
  cursor.pathDuration = getMoveDuration(dist) * 1.5; // slower, deliberate
  cursor.phase = 'moveToFontOption';
  cursorEl.className = '';
}

function startFontOptionClick() {
  cursor.phase = 'fontOptionClick';
  cursor.hoverTimer = randomRange(80, 180);
  // Apply the font
  const optionEl = fontOptionEls[cursor.selectedFontIndex];
  const newFontCss = optionEl.dataset.fontCss;
  const newFontName = optionEl.dataset.fontName;
  pairFonts[cursor.targetPair] = newFontCss;
  elements[cursor.targetPair].style.fontFamily = newFontCss;
  // Recalculate natural dimensions since font changed
  const ps = pairState[cursor.targetPair];
  // Temporarily reset scale to measure natural size
  const oldTransform = elements[cursor.targetPair].style.transform;
  elements[cursor.targetPair].style.transform = `translate(${ps.x.toFixed(2)}px, ${ps.y.toFixed(2)}px) scale(1, 1)`;
  // Force reflow
  const r = elements[cursor.targetPair].getBoundingClientRect();
  ps.naturalHW = r.width / 2;
  ps.naturalHH = r.height / 2;
  // Restore transform
  elements[cursor.targetPair].style.transform = oldTransform;
}

function startFontDismiss() {
  cursor.phase = 'fontDismiss';
  cursor.hoverTimer = randomRange(80, 200);
  hideFontDropdown();
  elements[cursor.targetPair].classList.remove('grabbed');
  cursorEl.className = '';
}

// ==================== ANIMATION LOOP ====================
let lastTime = performance.now();
startIdle();

function animate(now) {
  const dt = Math.min(now - lastTime, 50);
  lastTime = now;

  switch (cursor.phase) {
    case 'idle':
      cursor.idleTimer -= dt;
      if (cursor.idleTimer <= 0) startMoveToTarget();
      break;

    case 'moveToTarget':
      if (followPath(cursor, now) >= 1) startHover();
      break;

    case 'hover':
      cursor.hoverTimer -= dt;
      cursor.x += handTremor(now * 0.01, 42) * 0.15;
      cursor.y += handTremor(now * 0.01, 99) * 0.15;
      if (cursor.hoverTimer <= 0) {
        if (cursor.actionType === 'transform') {
          startMoveToHandle();
        } else if (cursor.actionType === 'fontChange') {
          startFontClick();
        } else {
          startGrab();
        }
      }
      break;

    // --- DRAG PATH ---
    case 'grab':
      cursor.hoverTimer -= dt;
      if (cursor.hoverTimer <= 0) startDrag();
      break;

    case 'drag': {
      const t = followPath(cursor, now);
      const cdx = cursor.x - cursor.dragStartCursorX;
      const cdy = cursor.y - cursor.dragStartCursorY;
      pairState[cursor.targetPair].x = cursor.dragStartPairX + cdx;
      pairState[cursor.targetPair].y = cursor.dragStartPairY + cdy;
      if (t >= 1) startRelease();
      break;
    }

    case 'release':
      cursor.hoverTimer -= dt;
      cursor.x += handTremor(now * 0.01, 77) * 0.12;
      cursor.y += handTremor(now * 0.01, 33) * 0.12;
      if (cursor.hoverTimer <= 0) startIdle();
      break;

    // --- TRANSFORM PATH ---
    case 'moveToHandle':
      if (followPath(cursor, now) >= 1) startHandleHover();
      break;

    case 'handleHover':
      cursor.hoverTimer -= dt;
      cursor.x += handTremor(now * 0.01, 55) * 0.12;
      cursor.y += handTremor(now * 0.01, 66) * 0.12;
      if (cursor.hoverTimer <= 0) startTransformGrab();
      break;

    case 'transformGrab':
      cursor.hoverTimer -= dt;
      if (cursor.hoverTimer <= 0) startTransformDrag();
      break;

    case 'transformDrag': {
      const t = followPath(cursor, now);
      const ps = pairState[cursor.targetPair];

      // newScaleX = |cursor.x - anchorX| / (2 * naturalHW)
      // (distance from anchor to cursor spans the full scaled width)
      const rawSX = Math.abs(cursor.x - cursor.anchorX) / (2 * ps.naturalHW);
      const rawSY = Math.abs(cursor.y - cursor.anchorY) / (2 * ps.naturalHH);
      ps.scaleX = clamp(rawSX, 0.25, 3.0);
      ps.scaleY = clamp(rawSY, 0.25, 3.0);

      // Keep anchor corner pinned: adjust translation so anchor stays fixed.
      // anchor = center - signX * naturalHW * scaleX  (for X axis)
      // => center = anchor + signX * naturalHW * scaleX
      const newCenterX = cursor.anchorX + cursor.signX * ps.naturalHW * ps.scaleX;
      const newCenterY = cursor.anchorY + cursor.signY * ps.naturalHH * ps.scaleY;
      ps.x = newCenterX - ps.baseCenterX;
      ps.y = newCenterY - ps.baseCenterY;

      updateTransformBoxPosition(cursor.targetPair);
      if (t >= 1) startTransformRelease();
      break;
    }

    case 'transformRelease':
      cursor.hoverTimer -= dt;
      cursor.x += handTremor(now * 0.01, 88) * 0.1;
      cursor.y += handTremor(now * 0.01, 44) * 0.1;
      if (cursor.hoverTimer <= 0) startIdle();
      break;

    // --- FONT CHANGE PATH ---
    case 'fontClick':
      cursor.hoverTimer -= dt;
      if (cursor.hoverTimer <= 0) startFontDropdownShow();
      break;

    case 'fontDropdownShow':
      cursor.hoverTimer -= dt;
      cursor.x += handTremor(now * 0.01, 22) * 0.08;
      cursor.y += handTremor(now * 0.01, 11) * 0.08;
      if (cursor.hoverTimer <= 0) startMoveToFontOption();
      break;

    case 'moveToFontOption': {
      const t = followPath(cursor, now);
      // Highlight whichever option the cursor is nearest
      const cy = cursor.y;
      let closest = 0;
      let closestDist = Infinity;
      fontOptionEls.forEach((el, i) => {
        const rect = el.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        const d = Math.abs(cy - mid);
        if (d < closestDist) { closestDist = d; closest = i; }
      });
      highlightFontOption(closest);
      if (t >= 1) {
        highlightFontOption(cursor.selectedFontIndex);
        startFontOptionClick();
      }
      break;
    }

    case 'fontOptionClick':
      cursor.hoverTimer -= dt;
      if (cursor.hoverTimer <= 0) startFontDismiss();
      break;

    case 'fontDismiss':
      cursor.hoverTimer -= dt;
      if (cursor.hoverTimer <= 0) startIdle();
      break;
  }

  // --- RENDER ---
  cursorEl.style.transform = `translate(${cursor.x.toFixed(1)}px, ${cursor.y.toFixed(1)}px)`;

  elements.forEach((el, i) => {
    const ps = pairState[i];
    el.style.transform = `translate(${ps.x.toFixed(2)}px, ${ps.y.toFixed(2)}px) scale(${ps.scaleX.toFixed(4)}, ${ps.scaleY.toFixed(4)})`;
  });

  // Keep transform box in sync during drag/scale if visible
  if (transformBox.classList.contains('visible') && cursor.targetPair >= 0) {
    updateTransformBoxPosition(cursor.targetPair);
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>
</body>
