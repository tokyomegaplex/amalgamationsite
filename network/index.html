<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network - Amalgamation</title>
  <link rel="stylesheet" href="styles.css?v=3">
  <script>
    if (new URLSearchParams(window.location.search).get('embed') === '1') {
      document.documentElement.classList.add('embed-mode');
    }
  </script>
  <style>
    .embed-mode #site-nav,
    .embed-mode #header,
    .embed-mode #controls,
    .embed-mode #info-panel,
    .embed-mode #projects-panel {
      display: none !important;
    }
    .embed-mode #graph-container {
      top: 0 !important;
      height: 100vh !important;
    }
    #site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 10px 24px;
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    #site-nav a {
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    #site-nav a:hover { color: var(--text); }
    #site-nav .nav-back {
      color: var(--accent);
      font-weight: 500;
    }
    #header { margin-top: 38px; }
  </style>
</head>
<body>
  <nav id="site-nav">
    <a href="../index.html" class="nav-back">&larr; Amalgamation</a>
    <a href="../index.html">Work</a>
    <a href="../experiments.html">Explorations</a>
    <a href="index.html" style="color: var(--text);">Network</a>
  </nav>

  <div id="app">
    <header id="header">
      <div class="header-left">
        <h1 class="logo">AMALGAMATION<span class="logo-accent">_NET</span></h1>
        <span class="subtitle">Creative Network Visualization</span>
      </div>
      <div class="header-right">
        <button id="projects-toggle" style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#8888a0;background:none;border:1px solid #2a2a3a;padding:4px 12px;border-radius:20px;cursor:pointer;margin-right:16px;transition:all 0.2s;">Projects</button>
        <div class="stats">
          <span id="node-count">0</span> people · <span id="active-tags">all</span>
        </div>
      </div>
    </header>

    <div id="controls">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="Search people, tags, studios..." autocomplete="off" />
        <kbd class="shortcut">/</kbd>
      </div>
      <div id="tag-filters"></div>
    </div>

    <div id="info-panel" class="hidden">
      <button id="panel-close">&times;</button>
      <div id="panel-content"></div>
    </div>

    <div id="projects-panel" class="hidden">
      <button id="projects-close">&times;</button>
      <div class="projects-panel-title">Projects</div>
      <div id="projects-list"></div>
    </div>

    <div id="graph-container">
      <canvas id="graph-canvas"></canvas>
    </div>
  </div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="network-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
